<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<!-- Entwurf (Prototyp) der neuen Startseite. Kein Produktionscode. Siehe docs/superpowers/specs/2026-11-15-website-neuentwurf-design.md -->
<title>juek3y.com Auftritte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..500&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: one fixed stage, two worlds, one crossing. Chapter Code carries the system theme, chapter Fotografie its counterpart. Every station has its own scene; the content lists at the top of the script decide which. */
:root{
  --bg:#F2F3F4; --ink:#0F0F10; --muted:#5A5D66; --line:#D4D6DB;
  --p-bg:#0F0F10; --p-ink:#F4F4F5; --p-muted:#8E9099;
  --accent:#1F4FFF; --p-accent:#7C96FF; --blend:#FFFFFF;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --serif:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --gl:max(clamp(16px,3vw,44px), env(safe-area-inset-left,0px));
  --gr:max(clamp(16px,3vw,44px), env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F0F10; --ink:#F4F4F5; --muted:#8E9099; --line:#2B2C31; --p-bg:#ECEDEF; --p-ink:#0F0F10; --p-muted:#5A5D66; --accent:#7C96FF; --p-accent:#1F4FFF; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F0F10; --ink:#F4F4F5; --muted:#8E9099; --line:#2B2C31; --p-bg:#ECEDEF; --p-ink:#0F0F10; --p-muted:#5A5D66; --accent:#7C96FF; --p-accent:#1F4FFF; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,p,ul{margin:0;padding:0} ul{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.pt{font-style:normal;color:var(--accent)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:none;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fx #gl{display:block}
.fx .spacer{height:1100vh}
.chrome{display:none}
.fx .chrome{display:block}
.top{position:fixed;z-index:50;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;padding-left:var(--gl);padding-right:var(--gr);color:var(--blend);mix-blend-mode:difference;pointer-events:none}
.top>*{pointer-events:auto}
.mark{font-weight:600;font-size:1.1rem;letter-spacing:-.03em}
.switch{display:flex;gap:clamp(10px,2vw,24px);font-size:.9375rem;font-weight:500}
.switch button{opacity:.55;display:flex;align-items:center;gap:7px;padding:6px 2px;transition:opacity .25s}
.switch button::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;transform:scale(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.switch button:hover,.switch button[aria-current="true"]{opacity:1}
.switch button[aria-current="true"]::before{transform:scale(1)}
.prog{position:fixed;z-index:51;top:env(safe-area-inset-top,0px);left:0;right:0;height:2px;background:var(--blend);mix-blend-mode:difference;transform:scaleX(0);transform-origin:left}
.cue{position:fixed;z-index:40;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:1.5px;height:44px;margin-left:-.75px;overflow:hidden;color:var(--blend);mix-blend-mode:difference;pointer-events:none;transition:opacity .4s}
.cue i{position:absolute;inset:0;background:currentColor;animation:cue 1.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes cue{0%{transform:translateY(-100%)}55%{transform:translateY(0)}100%{transform:translateY(100%)}}
.legal{position:fixed;z-index:44;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);opacity:0;transition:opacity .4s;pointer-events:none}
.legal.on{opacity:1}
.legal.on button{pointer-events:auto;color:inherit;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.seg{white-space:nowrap}
@media (max-width:560px){ .form{bottom:calc(80px + env(safe-area-inset-bottom,0px))} }
.pillbtn{border-radius:999px;padding:12px 22px;font-weight:500;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.pillbtn span{display:inline-block;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.pillbtn:hover span{transform:translate(2px,-2px)}
.open{position:fixed;z-index:45;left:var(--gl);bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(12px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s cubic-bezier(.2,.8,.2,1);background:var(--ink);color:var(--bg)}
.open.on{opacity:1;transform:none;pointer-events:auto}
.form{--err:#B3261E;position:fixed;z-index:45;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:min(34rem,calc(100% - 32px));transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1);color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 20px}
.form.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.f{display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.f.wide,.f-foot,.done{grid-column:1/-1}
.f label{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea{font:inherit;font-size:1.0625rem;color:var(--ink);background:none;border:0;border-bottom:1.5px solid var(--muted);border-radius:0;padding:6px 0 8px;outline:0;resize:none;width:100%}
/* the line of the site, again: focus draws it under the field, the dot leads */
.f i{display:block;position:relative;width:0;height:3px;margin-top:-4.5px;background:var(--ink);border-radius:2px;transition:width .55s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.f i::after{content:"";position:absolute;right:-5px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .3s}
.f:focus-within i{width:100%} .f:focus-within i::after{transform:scale(1)}
.f .err{margin:4px 0 0;font-size:.8125rem;color:var(--err)}
.f-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.send{background:var(--ink);color:var(--bg)}
.note{font-size:.8125rem;line-height:1.45;color:var(--muted);margin:0;flex:1;min-width:13rem}
.note b{font-weight:500;color:var(--ink);user-select:all}
.done{font-size:1.25rem;margin:0}.done small{display:block;font-size:.8125rem;color:var(--muted)}
.form.sent .f,.form.sent .f-foot{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .form{--err:#FF8A80} }
:root[data-theme="dark"] .form{--err:#FF8A80}
@media (max-width:560px){ .form{grid-template-columns:minmax(0,1fr);gap:10px} }
.detail{position:fixed;inset:0;z-index:80;background:var(--bg);color:var(--ink);overflow:auto;visibility:hidden;clip-path:circle(0px at 50% 50%)}
.detail.on{visibility:visible}
.d-in{max-width:70rem;margin-inline:auto;padding-left:var(--gl);padding-right:var(--gr);padding-block:calc(16px + env(safe-area-inset-top,0px)) 72px;display:flex;flex-direction:column;gap:clamp(24px,5vh,56px)}
.d-bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.back{border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:500;font-size:.9375rem;transition:background .2s,color .2s}
.back:hover{background:var(--ink);color:var(--bg)}
.d-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px}
.d-head svg{width:clamp(64px,9vw,112px);height:auto;flex:none}
.d-head h2{font-size:clamp(3rem,12vw,9.5rem);font-weight:600;letter-spacing:-.055em;line-height:.92}
.d-lead{font-size:clamp(1.3rem,2.6vw,2.1rem);letter-spacing:-.02em;line-height:1.25;max-width:24ch;text-wrap:balance}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(20px,4vw,56px);align-items:start}
.d-facts li{border-top:1px solid var(--line);padding-block:13px}
.d-facts li:last-child{border-bottom:1px solid var(--line)}
.d-shots{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.d-shot{flex:none;width:min(38vw,200px);aspect-ratio:9/19;border:1px solid var(--line);border-radius:24px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:12px}
.d-act{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.d-act .pillbtn{background:var(--ink);color:var(--bg)}
.d-legal{color:var(--muted)}
@media (max-width:760px){ .d-grid{grid-template-columns:minmax(0,1fr)} }
.ring{position:fixed;z-index:60;left:0;top:0;width:72px;height:72px;margin:-36px 0 0 -36px;pointer-events:none;color:var(--blend);mix-blend-mode:difference;opacity:0;transition:opacity .3s}
.ring.on{opacity:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke:currentColor;stroke-width:1.5}
.ring .bg{opacity:.35}
.ring .fg{stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1}
.ring span{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap}
.plain{max-width:44rem;margin-inline:auto;padding-left:var(--gl);padding-right:var(--gr);padding-block:96px 64px;display:flex;flex-direction:column;gap:48px}
.plain h1{font-size:clamp(2.4rem,8vw,4.5rem);font-weight:600;letter-spacing:-.045em;line-height:1}
.plain h2{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
.plain li{border-top:1px solid var(--line);padding-block:12px;color:var(--muted)}
.plain li b{color:var(--ink);font-weight:600;margin-right:8px}
.plain .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.plain .shots img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;display:block}
.plain .mail{font-size:1.25rem;user-select:all}
.fx .plain{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="chrome">
  <header class="top">
    <button class="mark" id="home" aria-label="Zum Anfang">JueK3y<i class="pt">.</i></button>
    <nav class="switch" aria-label="Kapitel">
      <button data-go="c" aria-current="true">Code</button>
      <button data-go="p" aria-current="false">Fotografie</button>
      <button data-go="e" aria-current="false">Kontakt</button>
    </nav>
  </header>
  <div class="prog" id="prog" aria-hidden="true"></div>
  <div class="cue" id="hint" aria-hidden="true"><i></i></div>
  <p class="legal mono" id="legal">Impressum · Datenschutz · <button id="theme" class="mono" aria-label="Farbschema, aktiv: System. Antippen wechselt.">Farbe: System</button></p>
  <button class="open pillbtn" id="open"><b id="open-l"></b><span aria-hidden="true">↗</span></button>
  <form class="form" id="form" novalidate>
    <div class="f"><label for="f-name">Name</label><input id="f-name" name="name" autocomplete="name"><i></i></div>
    <div class="f"><label for="f-mail">E-Mail</label><input id="f-mail" name="email" type="email" autocomplete="email" inputmode="email" aria-describedby="e-mail"><i></i><p class="err" id="e-mail" hidden>Bitte gib eine gültige E-Mail-Adresse an.</p></div>
    <div class="f wide"><label for="f-msg">Nachricht</label><textarea id="f-msg" name="message" rows="2" aria-describedby="e-msg"></textarea><i></i><p class="err" id="e-msg" hidden>Schreib bitte kurz, worum es geht.</p></div>
    <div class="f-foot"><button class="send pillbtn" type="submit">Nachricht senden <span aria-hidden="true">↗</span></button>
      <p class="note">Oder direkt an <b>hello@juek3y.com</b>. Deine Angaben nutze ich nur für die Antwort. Mehr im Datenschutz.</p></div>
    <p class="done" id="done" role="status" hidden>Danke. Ich melde mich bei dir.<small>Im Entwurf wird nichts gesendet.</small></p>
  </form>
  <div class="ring" id="ring" aria-hidden="true"><svg viewBox="0 0 72 72"><circle class="bg" cx="36" cy="36" r="30"/><circle class="fg" id="ring-fg" cx="36" cy="36" r="30" pathLength="1"/></svg><span class="mono" id="ring-l"></span></div>
</div>
<div class="spacer" aria-hidden="true"></div>
<article class="detail" id="detail" aria-hidden="true"><div class="d-in" id="d-in"></div></article>
<main class="plain" id="plain"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  /* ============ CONTENT: this is the only part to touch when an app or a photo series is added ============
     scene  = how an app enters:      'route' | 'bars' | 'orbit'
     layout = how a series is hung:   'wave'  | 'tunnel' | 'stack'
     shots  = [title, file, width/height]                                                                   */
  const APPS = [
    { kind: 'App · Reisen', name: 'TravelFlow', desc: 'Eine Reise als Zeitleiste, Tag für Tag.', scene: 'route',
      facts: ['Reiseplan als Zeitleiste', 'Ortssuche und Flüge eingebaut', 'Für das Telefon gebaut'] },
    { kind: 'App · Finanzen', name: 'Saldo', desc: 'Die eigenen Finanzen, auf dem eigenen Server.', scene: 'balance',
      facts: ['Läuft auf dem eigenen Server', 'Bankabruf nur lesend', 'Anmeldung mit Passkey'] },
    { kind: 'App · Gewohnheiten', name: '1000 Days', desc: 'Aus Gewohnheiten wird dein eigenes Universum.', scene: 'orbit', accent: '#F76107',
      facts: ['Jede Gewohnheit baut am eigenen Universum mit', 'Beta im Play Store'],
      icon: '<svg viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="22" fill="#0F0F10"/><ellipse cx="48" cy="48" rx="30" ry="14" transform="rotate(-52 48 48)" fill="none" stroke="#fff" stroke-width="4.5"/><circle cx="46" cy="50" r="7" fill="#fff"/><circle cx="66" cy="23" r="5" fill="#F76107"/></svg>' }
  ];
  const SERIES = [
    { name: 'Meer', layout: 'wave', shots: [['Brandung', 'surf', .75], ['Steilküste', 'cliff', .75], ['Quallen', 'jelly', .75], ['Abendlicht', 'palm', .8]] },
    { name: 'Wüste', layout: 'tunnel', shots: [['Roter Fels', 'desert', .75], ['Leere Straße', 'road', .75], ['Dickhornschaf', 'ram', .75], ['Kakteen', 'cactus', 1.5]] },
    { name: 'Unterwegs', layout: 'stack', shots: [['Laternen', 'lantern', .667], ['Schrein', 'shrine', 1.5], ['Neon', 'neon', .75], ['Fensterplatz', 'window', .75]] }
  ];
  const MAIL = 'hello@juek3y.com';
  const NSHOTS = SERIES.reduce((n, s) => n + s.shots.length, 0);

  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const root = document.documentElement, canvas = $('#gl');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const back = t => { const c = 1.9; t = clamp(t, 0, 1) - 1; return 1 + (c + 1) * t * t * t + c * t * t; };
  const euro = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });

  // the plain document is generated from the same lists: it is what readers, reduced motion and browsers without WebGL get
  $('#plain').innerHTML = `<h1>JueK3y<i class="pt">.</i> Code und Fotografie</h1><section><h2>Code</h2><ul>${APPS.map(a => `<li><b>${a.name}</b>${a.desc}</li>`).join('')}</ul></section>` +
    SERIES.map(s => `<section><h2>${s.name}</h2><div class="shots">${s.shots.map(x => `<img src="img/${x[1]}.jpg" alt="${x[0]}" loading="lazy">`).join('')}</div></section>`).join('') +
    `<section><h2>Kontakt</h2><p class="mail">${MAIL}</p></section>`;
  const form = $('#form');
  form.addEventListener('submit', e => { e.preventDefault();
    const mail = $('#f-mail'), msg = $('#f-msg'), badMail = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail.value.trim()), badMsg = msg.value.trim().length < 3;
    $('#e-mail').hidden = !badMail; $('#e-msg').hidden = !badMsg; mail.setAttribute('aria-invalid', String(badMail)); msg.setAttribute('aria-invalid', String(badMsg));
    if (badMail) return mail.focus(); if (badMsg) return msg.focus();
    form.classList.add('sent'); $('#done').hidden = false; });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || typeof THREE === 'undefined' || typeof gsap === 'undefined') return;
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' }); } catch (e) { return; }
  root.classList.add('fx');

  const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const DPR = Math.min(devicePixelRatio || 1, 2);
  const F = { sans: "'Geist',system-ui,sans-serif", mono: "'Geist Mono',ui-monospace,monospace", serif: "'Instrument Serif',Georgia,serif" };
  let W = innerWidth, H = innerHeight;
  if (!FINE) $('#ring').style.display = 'none';

  const VARS = { bg: '--bg', ink: '--ink', muted: '--muted', accent: '--accent', pbg: '--p-bg', pink: '--p-ink', pmuted: '--p-muted' };
  const COL = {}; Object.keys(VARS).forEach(k => { COL[k] = new THREE.Color(); });
  const readTheme = () => { const cs = getComputedStyle(root); Object.keys(VARS).forEach(k => COL[k].set(cs.getPropertyValue(VARS[k]).trim() || '#888')); };
  readTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(readTheme, 0));
  new MutationObserver(readTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });

  /* text as textures (white, tinted by the material) so lens and portal can bend it */
  // side -1: text shows only below the line (it is rubbed out as it scrolls up into it); side +1: only above it (letters sink into or rise out of the line)
  const EV = { uEnv: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uH: { value: 1 }, uThick: { value: 6 }, uLevel: { value: 2 } };
  const eraseMat = (tex, tint, side) => new THREE.ShaderMaterial({ transparent: true, depthTest: false, depthWrite: false,
    uniforms: { map: { value: tex }, uCol: { value: COL[tint || 'ink'] }, uOp: { value: 1 }, uSide: { value: side }, uEnv: EV.uEnv, uRes: EV.uRes, uH: EV.uH, uThick: EV.uThick, uLevel: EV.uLevel },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D map,uEnv; uniform vec3 uCol; uniform float uOp,uSide,uH,uThick,uLevel; uniform vec2 uRes; varying vec2 vUv;
      float h(float i){ vec4 a=texture2D(uEnv,vec2((i+0.5)/256.0,0.5)); return a.b<0.5 ? -1.0 : (a.r*255.0*256.0+a.g*255.0)/65535.0; }
      void main(){ float al=texture2D(map,vUv).a*uOp; vec2 sc=gl_FragCoord.xy/uRes; float f=clamp(sc.x*256.0-0.5,0.0,255.0), i=floor(f), a=h(i), b=h(min(i+1.0,255.0));
        if(uSide<-1.5){ al*=1.0-smoothstep(-4.0,-1.0,(sc.y-uLevel)*uH); } else if(a>=0.0&&b>=0.0){ float d=(sc.y-mix(a,b,f-i))*uH, e=uThick*0.5;
          al*= uSide<0.0 ? 1.0-smoothstep(-e-2.5,-e-0.5,d) : smoothstep(e+0.5,e+2.5,d); }
        gl_FragColor=vec4(uCol,al); }` });
  const basic = tint => { const m = new THREE.MeshBasicMaterial({ transparent: true, depthTest: false, depthWrite: false }); m.color = COL[tint || 'ink']; return m; };
  const textMesh = (str, o) => {
    const s = 2, px = o.px, c = document.createElement('canvas'), x = c.getContext('2d');
    const font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${px * s}px ${o.family}`;
    const prep = () => { x.font = font; if (o.ls && 'letterSpacing' in x) x.letterSpacing = (o.ls * px * s) + 'px'; };
