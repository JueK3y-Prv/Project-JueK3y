# Kopfzeilen für alle Seiten
[[headers]]
  for = "/*"
    [headers.values]
      # Nur eigene Inhalte: keine fremden Skripte, Schriften, Bilder oder Verbindungen. Die Rechtstexte tragen ihr Aussehen in der Seite, deshalb 'unsafe-inline' nur für Stile.
      Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"
      Referrer-Policy = "same-origin"
      Strict-Transport-Security = "max-age=2592000; includeSubdomains; preload"
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      X-Permitted-Cross-Domain-Policies = "none"

# Die Netlify-Adresse führt auf die eigene Domain
[[redirects]]
  from = "https://juek3y.netlify.app/*"
  to = "https://juek3y.com/:splat"
  status = 301
  force = true

# Unterseiten der Apps: Die Startseite öffnet die Unterseite selbst, aus dem Akzentpunkt der Station.
# Deshalb liefern diese Adressen die Startseite aus (Status 200, die Adresse bleibt stehen).
# Die Rechtstexte darunter (/saldo/datenschutz usw.) sind echte Dateien und bleiben davon unberührt.
# Neue App: hier eintragen, deutsch und englisch. Die id steht in src/js/start/inhalt.js.
[[redirects]]
  from = "/travelflow"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/saldo"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/1000days"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/travelflow"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/en/saldo"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/en/1000days"
  to = "/en/index.html"
  status = 200

# Alte Adressen. Unbekannte Adressen brauchen keine Regel: Netlify zeigt dafür /404.html.
[[redirects]]
  from = "/saldo/tos"
  to = "/saldo/nutzungsbedingungen"
  status = 301

[[redirects]]
  from = "/saldo/tos.html"
  to = "/saldo/nutzungsbedingungen"
  status = 301

[[redirects]]
  from = "/en/coming-soon"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/en/projects"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/en/social-media"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/en/un-index"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/en/page-not-found"
  to = "/en/"
  status = 301

[functions]
  node_bundler = "esbuild"
